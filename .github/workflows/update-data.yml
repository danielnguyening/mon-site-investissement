name: Mise à jour des données

on:
  schedule:
    - cron: '0 1-23/2 * * *'   # toutes les 2 heures : 0 h, 2 h, 4 h … 22 h, heure du Vietnam
  workflow_dispatch: {}   # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Installer yfinance
        run: pip install --quiet yfinance

      - name: Récupérer les cours
        run: python scripts/update_data.py

      - name: Enregistrer les nouveaux chiffres
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git pull --rebase --quiet
            git push
          fi
