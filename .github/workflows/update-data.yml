name: Mise à jour des données

on:
  schedule:
    - cron: '0 0 * * *'   # 7 h, heure du Vietnam (après la clôture de Wall Street)
    - cron: '0 9 * * *'   # 16 h, heure du Vietnam (après la clôture de Hô Chi Minh-Ville)
  workflow_dispatch: {}   # bouton « Run workflow » pour lancer à la main

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Récupérer les cours
        run: python scripts/update_data.py

      - name: Enregistrer les nouveaux chiffres
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Mise à jour automatique des données ($(date -u +'%Y-%m-%d %H:%M') UTC)"
            git push
          fi
